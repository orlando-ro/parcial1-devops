<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hola mundo</title>
    <style>
      :root {
        --bg-deep: #0d1117;
        --bg-mid: #1a2333;
        --panel: rgba(255, 248, 234, 0.08);
        --panel-border: rgba(255, 255, 255, 0.18);
        --ink: #f9f3ea;
        --muted: #d7c9b6;
        --gold: #e9c46a;
        --gold-strong: #d4a64d;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(circle at top, rgba(233, 196, 106, 0.2), transparent 30%),
          linear-gradient(145deg, var(--bg-deep), var(--bg-mid));
        color: var(--ink);
      }

      .page-shell {
        width: min(90vw, 1100px);
        min-height: 78vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      .hero {
        position: relative;
        width: min(760px, 100%);
        padding: 60px 52px 48px;
        text-align: center;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
        border: 1px solid var(--panel-border);
        box-shadow: 0 24px 60px var(--shadow);
        backdrop-filter: blur(6px);
        overflow: hidden;
      }

      .hero::before,
      .hero::after {
        content: "";
        position: absolute;
        inset: 18px;
        border: 1px solid rgba(233, 196, 106, 0.35);
        pointer-events: none;
      }

      .hero::after {
        inset: 30px;
        border-color: rgba(255, 255, 255, 0.12);
      }

      .eyebrow {
        margin: 0 0 18px;
        font-size: 0.8rem;
        letter-spacing: 0.5rem;
        text-transform: uppercase;
        color: var(--gold);
      }

      h1 {
        margin: 0;
        font-size: clamp(3.5rem, 8vw, 8rem);
        line-height: 0.92;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 700;
        color: #f7f0e6;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.45);
      }

      .lead {
        max-width: 520px;
        margin: 24px auto 0;
        font-size: 1.05rem;
        line-height: 1.8;
        letter-spacing: 0.08em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .cta-row {
        margin-top: 36px;
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .cta-row a {
        display: inline-block;
        padding: 14px 26px;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        border: 1px solid rgba(233, 196, 106, 0.7);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .cta-row a:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(233, 196, 106, 0.2);
      }

      .primary {
        background: linear-gradient(135deg, var(--gold), var(--gold-strong));
        color: #1a140d;
        font-weight: 700;
      }

      .secondary {
        color: var(--ink);
        background: rgba(255, 255, 255, 0.02);
      }

      @media (max-width: 600px) {
        .hero {
          padding: 42px 24px 34px;
        }

        .eyebrow {
          letter-spacing: 0.28rem;
        }

        h1 {
          letter-spacing: 0.12em;
        }

        .lead {
          letter-spacing: 0.04em;
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <section class="hero" aria-label="Hero de bienvenida">
        <p class="eyebrow">Bienvenido</p>
        <h1>Hola mundo</h1>
        <p class="lead">Un saludo clásico, elegante y lleno de estilo.</p>
        <div class="cta-row">
          <a class="primary" href="#">Comenzar</a>
          <a class="secondary" href="#">Descubrir</a>
        </div>
      </section>
    </main>
  </body>
</html>

<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#fbfaf8">
	<title>Hello, world — Orlando Rodriguez</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #37352f;
			--muted: #85837e;
			--line: #e9e7e3;
			--paper: #fbfaf8;
			--accent: #a87550;
		}
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			background: var(--paper);
			color: var(--ink);
			font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			-webkit-font-smoothing: antialiased;
		}
		.page { width: min(100% - 48px, 760px); margin: 0 auto; padding: 34px 0 40px; }
		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding-bottom: 22px;
			border-bottom: 1px solid var(--line);
			color: var(--muted);
			font-size: 12px;
		}
		h1 { margin: 0; font-size: clamp(50px, 9vw, 82px); font-weight: 600; letter-spacing: -.075em; line-height: 1.02; }
		h1 .hello { color: var(--accent); }
		.name { margin: 19px 0 0; color: #77746d; font-family: Georgia, "Times New Roman", serif; font-size: clamp(20px, 3vw, 25px); font-style: italic; }
		.note {
			max-width: 475px;
			margin-top: 68px;
			padding: 18px 20px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: rgba(255, 255, 255, .55);
			color: #77746d;
			font-size: 14px;
			line-height: 1.7;
		}
		.note strong { color: var(--ink); font-weight: 600; }
		footer { display: flex; justify-content: space-between; margin-top: 100px; padding-top: 18px; border-top: 1px solid var(--line); color: #a09d96; font-size: 11px; }
		@media (max-width: 520px) {
			.page { width: min(100% - 36px, 760px); padding-top: 24px; }
			main { padding-top: 100px; }
			.note { margin-top: 52px; }
			footer { margin-top: 80px; }
			.status { font-size: 10px; }
		}
	</style>
</head>
<body>
	<div class="page">
		<main>
			<h1><span class="hello">Hello,</span><br>world.</h1>
			<p class="name">Soy Orlando Rodriguez.</p>
			<div class="note"><strong>Hola.</strong> que tal?.</div>
		</main>
		<footer><span>Hecho con cariño</span><span>© Orlando Rodriguez</span></footer>
	</div>
</body>
</html>
